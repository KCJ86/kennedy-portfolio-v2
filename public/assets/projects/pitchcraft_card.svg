<svg width="100%" viewBox="0 0 680 410" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Pitchcraft card</title>
  <desc>Brutalist concrete-style Pitchcraft portfolio card</desc>

  <defs>
    <!-- Concrete texture via turbulence -->
    <filter id="concrete" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="4" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="grayNoise"/>
      <feBlend in="SourceGraphic" in2="grayNoise" mode="multiply" result="blended"/>
      <feComposite in="blended" in2="SourceGraphic" operator="in"/>
    </filter>

    <!-- Subtle vignette -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.55"/>
    </radialGradient>
  </defs>

  <!-- Background — dark concrete grey -->
  <rect x="0" y="0" width="680" height="410" rx="16" fill="#1a1917"/>

  <!-- Concrete texture overlay -->
  <rect x="0" y="0" width="680" height="410" rx="16" fill="#2e2c28" filter="url(#concrete)" opacity="0.6"/>

  <!-- Vignette -->
  <rect x="0" y="0" width="680" height="410" rx="16" fill="url(#vignette)"/>

  <!-- Structural grid — heavy vertical slabs like brutalist columns -->
  <rect x="0"   y="0" width="2" height="410" fill="#fff" opacity="0.06"/>
  <rect x="170" y="0" width="1" height="410" fill="#fff" opacity="0.05"/>
  <rect x="340" y="0" width="1" height="410" fill="#fff" opacity="0.05"/>
  <rect x="510" y="0" width="1" height="410" fill="#fff" opacity="0.05"/>
  <rect x="678" y="0" width="2" height="410" fill="#fff" opacity="0.06"/>

  <!-- Horizontal slabs -->
  <rect x="0" y="0"   width="680" height="2" fill="#fff" opacity="0.06"/>
  <rect x="0" y="136" width="680" height="1" fill="#fff" opacity="0.05"/>
  <rect x="0" y="272" width="680" height="1" fill="#fff" opacity="0.05"/>
  <rect x="0" y="408" width="680" height="2" fill="#fff" opacity="0.06"/>

  <!-- Modular icon — 3x3 block grid, top left, like the CBC/Brutalist logo feel -->
  <g transform="translate(32, 32)">
    <!-- Row 1 -->
    <rect x="0"  y="0"  width="18" height="18" fill="#fff" opacity="0.9"/>
    <rect x="22" y="0"  width="18" height="18" fill="#fff" opacity="0.4"/>
    <rect x="44" y="0"  width="18" height="18" fill="#fff" opacity="0.9"/>
    <!-- Row 2 -->
    <rect x="0"  y="22" width="18" height="18" fill="#fff" opacity="0.4"/>
    <rect x="22" y="22" width="18" height="18" fill="#fff" opacity="0.9"/>
    <rect x="44" y="22" width="18" height="18" fill="#fff" opacity="0.4"/>
    <!-- Row 3 -->
    <rect x="0"  y="44" width="18" height="18" fill="#fff" opacity="0.9"/>
    <rect x="22" y="44" width="18" height="18" fill="#fff" opacity="0.4"/>
    <rect x="44" y="44" width="18" height="18" fill="#fff" opacity="0.9"/>
  </g>

  <!-- Wordmark — heavy sans-style via tight tracking, bottom left, large -->
  <text
    x="32" y="360"
    font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif"
    font-size="72"
    font-weight="900"
    fill="#fff"
    opacity="0.95"
    letter-spacing="-2">PITCH</text>

  <text
    x="32" y="410"
    font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif"
    font-size="72"
    font-weight="900"
    fill="#fff"
    opacity="0.18"
    letter-spacing="-2">CRAFT</text>

  <!-- Tag — top right, spaced caps -->
  <text
    x="648" y="52"
    font-family="'Helvetica Neue', Arial, sans-serif"
    font-size="9"
    fill="#fff"
    opacity="0.3"
    letter-spacing="4"
    text-anchor="end">AI · JOB SEARCH · 03</text>

</svg>
