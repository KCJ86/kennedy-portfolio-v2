<svg width="100%" viewBox="0 0 680 410" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Optimizer logo card</title>
  <desc>Dark editorial Optimizer logo card for portfolio thumbnail</desc>

  <rect x="0" y="0" width="680" height="410" rx="16" fill="#090d12"/>

  <line x1="40" y1="0" x2="40" y2="410" stroke="#4a90d9" stroke-width="0.5" opacity="0.12"/>
  <line x1="640" y1="0" x2="640" y2="410" stroke="#4a90d9" stroke-width="0.5" opacity="0.12"/>
  <line x1="0" y1="40" x2="680" y2="40" stroke="#4a90d9" stroke-width="0.5" opacity="0.12"/>
  <line x1="0" y1="370" x2="680" y2="370" stroke="#4a90d9" stroke-width="0.5" opacity="0.12"/>

  <!-- Stacked triangle mark -->
  <g transform="translate(296, 118)">
    <polygon points="0,0 88,0 56,54" fill="#1a3a5c" opacity="0.5"/>
    <polygon points="10,12 82,12 56,54" fill="#2a5f96" opacity="0.65"/>
    <polygon points="22,26 76,26 56,54" fill="#4a90d9" opacity="0.9"/>
  </g>

  <!-- Wordmark -->
  <text x="340" y="310" font-family="Georgia, 'Times New Roman', serif" font-size="48" font-weight="400" fill="#ddeaf7" text-anchor="middle" letter-spacing="2">Optim<tspan font-style="italic" fill="#4a90d9">izer</tspan></text>

  <!-- Decorative rule -->
  <line x1="240" y1="332" x2="300" y2="332" stroke="#4a90d9" stroke-width="0.5" opacity="0.4"/>
  <circle cx="340" cy="332" r="2" fill="#4a90d9" opacity="0.5"/>
  <line x1="380" y1="332" x2="440" y2="332" stroke="#4a90d9" stroke-width="0.5" opacity="0.4"/>

  <!-- StatRad logo mark — bottom right corner -->
  <g transform="translate(568, 328)" opacity="0.55">
    <polygon points="0,0 40,0 26,24" fill="#1a3a5c"/>
    <polygon points="5,6 38,6 26,24" fill="#2a5f96"/>
    <polygon points="11,13 34,13 26,24" fill="#4a90d9"/>
    <text x="46" y="20" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#7aaed4" letter-spacing="0.5">statrad</text>
  </g>
</svg>
